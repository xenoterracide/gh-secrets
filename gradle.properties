org.gradle.caching = true
org.gradle.parallel = true
org.gradle.configuration-cache = true
org.gradle.configuration-cache.parallel = true
org.gradle.jvmargs = \
  -XX:+UseZGC \
  -XX:+ZGenerational \
  -XX:+UseStringDeduplication \
  -Xmx1g \
  -XX:MaxMetaspaceSize=512m \
  -Dfile.encoding=UTF-8 \
  -Duser.country=US \
  -Duser.language=en
